<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080e1e"/>
      <stop offset="50%" stop-color="#0f1f3d"/>
      <stop offset="100%" stop-color="#050a14"/>
    </linearGradient>
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#0072ff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="600" height="600" rx="40" fill="url(#bg-grad)"/>
  <circle cx="300" cy="300" r="230" fill="none" stroke="#1e293b" stroke-width="2" stroke-dasharray="8 8"/>
  <circle cx="300" cy="300" r="210" fill="none" stroke="url(#cyan-glow)" stroke-width="3" opacity="0.6"/>
  <circle cx="300" cy="220" r="70" fill="#172554" stroke="url(#cyan-glow)" stroke-width="3"/>
  <path d="M180 430 C180 340, 230 320, 300 320 C370 320, 420 340, 420 430 Z" fill="#172554" stroke="url(#cyan-glow)" stroke-width="3"/>
  <!-- Decorative tech badge -->
  <g transform="translate(300, 490)">
    <rect x="-170" y="-22" width="340" height="44" rx="22" fill="#0b132b" stroke="#00f2fe" stroke-width="1.5" filter="url(#glow)"/>
    <text x="0" y="6" text-anchor="middle" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" letter-spacing="1">
      PROFILE PHOTO WILL BE ADDED SOON
    </text>
  </g>
  <!-- Initials watermark -->
  <text x="300" y="240" text-anchor="middle" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="700">
    AA
  </text>
</svg>
